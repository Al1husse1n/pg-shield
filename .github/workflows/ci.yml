# PGShield Continuous Integration (CI) Workflow
# This workflow runs four distinct jobs: lint (code quality inspection), unit (isolated tests with no DB),
# integration (tests against a native GitHub Actions service container), and compose (tests against docker-compose.yml).
# Both integration and compose jobs exist because they validate PostgreSQL via different orchestration mechanisms;
# if compose fails while integration passes, we know docker-compose.yml is broken rather than application code.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory in Phase 5; Phase 6 makes this blocking after fixing lint issues
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    defaults:
      run:
        working-directory: Main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install

      - name: Run unit tests
        run: pytest -q

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Main
    env:
      PGSHIELD_TEST_DSN: "postgresql://postgres:postgres@localhost:5432/postgres"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install

      - name: Run integration tests
        run: pytest -q -m integration

  compose:
    name: Docker Compose Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install
        working-directory: Main

      - name: Start services via Docker Compose
        run: docker compose up -d --wait

      - name: Inspect running services
        run: docker compose ps

      - name: Run integration tests against Compose Postgres
        env:
          PGSHIELD_TEST_DSN: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: pytest -q -m integration
        working-directory: Main

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down

